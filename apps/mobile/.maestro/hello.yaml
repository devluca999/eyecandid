# Phase 1 exit check on mobile: tap run, watch live progress, see the result. Runs on the EAS preview build.
appId: app.eyelore
---
- launchApp:
    clearState: true
- assertVisible: "Making real people look great."
- tapOn:
    id: "run-hello"
- extendedWaitUntil:
    visible:
      id: "result"
    timeout: 60000
- assertVisible: "hello from the phone"
