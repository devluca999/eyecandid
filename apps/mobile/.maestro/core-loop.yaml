# Phase 2 exit check on mobile: a new user imports a clip and ends with an exported, captioned, reframed video
# saved to the camera roll, in under 3 minutes. Everything is real: the system photo picker, the upload, the pipeline
# on a CPU worker and the render. (Simulators have no camera, so the clip is imported.) Single waits are generous because a 2-core CI runner shares its cores with the emulator; the bound that counts
# is the whole flow: run-ci.sh fails the job if it took 180s or more.
appId: app.eyelore
---
# the clip a new user would have in their camera roll (Maestro only reads media from inside this folder:
# run-ci.sh copies services/engine/tests/fixtures/talk.mp4 to media/ first; do the same before a local run)
- addMedia:
    - "media/talk.mp4"
- launchApp:
    clearState: true
# a software-rendered emulator can raise "System UI isn't responding" while it settles: wait it out
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
- assertVisible: "Making real people look great."
- tapOn:
    id: "import"
# the Android photo picker: the fixture is the only video in the gallery
- extendedWaitUntil:
    visible:
      id: ".*icon_thumbnail"
    timeout: 15000
- tapOn:
    id: ".*icon_thumbnail"
    index: 0
# review opens at once on the local file, with an honest stage line while the engine works
- extendedWaitUntil:
    visible:
      id: "lens"
    timeout: 10000
# ready: the summary line replaces the stage line ("2 fillers trimmed · 1 pause cut")
- extendedWaitUntil:
    visible:
      id: "ready"
    timeout: 60000
- assertVisible:
    id: "struck-word"
- assertVisible:
    id: "caption"
# a light edit: restore the first struck word, then re-frame
- tapOn:
    id: "struck-word"
    index: 0
- tapOn:
    id: "aspect-9x16"
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
- tapOn:
    id: "export"
- extendedWaitUntil:
    visible:
      id: "export-saved"
    timeout: 140000
- assertVisible:
    id: "share"
