# Phase 2 exit check on mobile: a new user imports a clip and ends with an exported, captioned, reframed video
# saved to the camera roll, in under 3 minutes. Everything is real: the system photo picker, the upload, the pipeline
# on a CPU worker and the render. (Simulators have no camera, so the clip is imported.) The waits below add up to 175s, so a pass means the whole loop took less than 3 minutes.
appId: app.eyelore
---
# the clip a new user would have in their camera roll (Maestro only reads media from inside this folder:
# `pnpm e2e` and run-ci.sh copy services/engine/tests/fixtures/talk.mp4 here first)
- addMedia:
    - "media/talk.mp4"
- launchApp:
    clearState: true
- assertVisible: "Making real people look great."
- tapOn:
    id: "import"
# the Android photo picker: the fixture is the only video in the gallery
- extendedWaitUntil:
    visible:
      id: ".*icon_thumbnail"
    timeout: 15000
- tapOn:
    id: ".*icon_thumbnail"
    index: 0
# review opens at once on the local file, with an honest stage line while the engine works
- extendedWaitUntil:
    visible:
      id: "lens"
    timeout: 10000
# ready: the summary line replaces the stage line ("2 fillers trimmed · 1 pause cut")
- extendedWaitUntil:
    visible:
      id: "ready"
    timeout: 60000
- assertVisible:
    id: "struck-word"
- assertVisible:
    id: "caption"
# a light edit: restore the first struck word, then re-frame
- tapOn:
    id: "struck-word"
    index: 0
- tapOn:
    id: "aspect-9x16"
- tapOn:
    id: "export"
- extendedWaitUntil:
    visible:
      id: "export-saved"
    timeout: 90000
- assertVisible:
    id: "share"
