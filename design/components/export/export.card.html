<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="../../assets/eyelore.js"></script>
<style>html,body{margin:0}body{padding:28px;min-height:100vh}.k{font:var(--font-timecode);color:var(--ink-secondary)}.l{font:var(--font-meta);color:var(--ink-secondary)}.row{display:flex;gap:24px;align-items:center}.col{display:flex;flex-direction:column;gap:12px;align-items:center}.stage{position:relative;border-radius:22px;overflow:hidden}.el-export .el-seg__opt{font:500 12px/16px var(--font-mono)}</style></head><body class="el-root"><div class="row" style="justify-content:center;gap:46px;align-items:center;padding-top:6px">
<div class="el-lens " data-scene="sofa" style="width:190px;aspect-ratio:9/16;"><div class="el-lens__frame"><div class="el-scene el-scene--live" data-scene="sofa"><b></b><i></i></div><div class="el-glass el-export" style="position:absolute;left:50%;bottom:14px;transform:translateX(-50%);min-height:36px"><span class="el-export__msg" style="font-size:12px"><span class="el-status" style="color:var(--ink)"><span class="el-dot el-dot--working"></span>rendering</span><span class="el-tc" style="color:var(--ink-secondary)">62%</span></span></div></div><svg class="el-ring"><rect x="1.5" y="1.5" style="width:calc(100% - 3px);height:calc(100% - 3px)" rx="22" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0.38"></rect></svg></div>
<div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
<div class="el-glass el-export"><div class="el-seg" style=""><button class="el-seg__opt is-on">9:16</button><button class="el-seg__opt">4:5</button><button class="el-seg__opt">16:9</button></div><span class="el-export__sep"></span><div class="el-seg" style=""><button class="el-seg__opt">15s</button><button class="el-seg__opt">30s</button><button class="el-seg__opt">60s</button></div><button class="el-export__go"><i data-icon="download"></i></button></div>
<div class="el-glass el-export"><span class="el-export__msg"><i data-icon="link" data-size="16"></i>copied link<span class="l">·</span><button class="el-pill el-pill--quiet el-pill--sm" style="padding:0 6px;color:var(--ink)">download</button></span></div></div></div></body></html>
