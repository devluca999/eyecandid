<!-- @dsCard group="Editor" viewport="1280x820" name="Editor" subtitle="Every feature, one canvas: theater · edit · board · sets · idea engine" -->
<!-- @startingPoint section="Screens" subtitle="Eyelore editor — footage fills the screen, UI on hover" viewport="1280x820" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>eyelore — editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/logo/favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="../../assets/eyelore.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{user-select:none}
.booting *{transition:none!important}
input,textarea,[contenteditable]{user-select:text}
.top{position:fixed;top:0;left:0;right:0;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 20px;z-index:40;pointer-events:none}
.top>*{pointer-events:auto}
.top-l,.top-r{display:flex;align-items:center;gap:10px;min-width:0}
.top-r{justify-content:flex-end}
.crumb{display:flex;align-items:center;gap:6px;border:0;background:none;font:var(--font-menu);color:var(--ink-secondary);cursor:pointer;height:32px;padding:0 10px;border-radius:999px;white-space:nowrap;min-width:0}
.crumb:hover{background:color-mix(in oklab,var(--ink) 6%,transparent);color:var(--ink)}
.crumb b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.searchpill{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border-radius:999px;border:0;font:var(--font-menu);color:var(--ink-secondary);cursor:pointer;background:color-mix(in oklab,var(--ink) 5%,transparent);white-space:nowrap;transition:background-color 160ms}
.searchpill:hover{background:color-mix(in oklab,var(--ink) 8%,transparent);color:var(--ink)}
.searchpill .el-icon{width:16px;height:16px}
@media (max-width:860px){.searchpill .txt{display:none}.crumb .ad{display:none}}

#lens{position:fixed;z-index:6;left:0;top:0;transition:left 560ms var(--spring-morph),top 560ms var(--spring-morph),width 560ms var(--spring-morph),height 560ms var(--spring-morph),border-radius 560ms var(--spring-morph),box-shadow 200ms var(--spring-soft),opacity 300ms var(--spring-soft),filter 320ms var(--spring-soft),transform 400ms var(--spring-soft)}
#lens.is-gone{opacity:0;transform:scale(.6);pointer-events:none}
#frame{cursor:default}
.mode-edit #frame.brushing,.mode-edit #frame.space{cursor:none}
#sceneWrap,#cutWrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
#cutWrap{z-index:2;opacity:0;transition:opacity 120ms}
#cutWrap.on{opacity:1}
#lensMeta{opacity:0}
#lens:hover #lensMeta,#lens.show-meta #lensMeta{opacity:1}
#exportPill{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);z-index:9;opacity:0;pointer-events:none;transition:opacity 200ms var(--spring-soft),transform 300ms var(--spring-pop)}
.mode-edit #lens:hover #exportPill,#exportPill.pin{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#exportPill .el-seg__opt{font:500 12px/16px var(--font-mono);height:32px;padding:0 10px}
#exportPill .el-export__go{width:32px;height:32px}
.theaterRing{position:fixed;z-index:5;pointer-events:none;transition:opacity 300ms,left 560ms var(--spring-morph),top 560ms var(--spring-morph),width 560ms var(--spring-morph),height 560ms var(--spring-morph)}
.theaterRing circle{fill:none;stroke-linecap:round}

.under{position:fixed;left:0;right:0;z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;transition:top 560ms var(--spring-morph),opacity 300ms}
.explain{display:flex;align-items:center;gap:14px;min-height:44px;flex-wrap:wrap;justify-content:center}
.threadbar{display:flex;align-items:center;gap:12px;font:var(--font-meta);color:var(--ink-secondary)}
#threadBox{position:relative;max-width:calc(100vw - 32px);overflow:visible}
#threadInner{transition:transform 560ms var(--spring-morph);transform-origin:50% 50%}
.dropline{position:absolute;top:58px;width:2px;height:64px;margin-left:-1px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 1px var(--canvas),0 0 10px var(--accent-glow);pointer-events:none}
@media (max-height:700px){.hint{display:none!important}}
.hint{font:var(--font-meta);color:var(--ink-secondary);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.side{position:fixed;z-index:7;width:max-content;transition:left 560ms var(--spring-morph),top 560ms var(--spring-morph),opacity 300ms var(--spring-soft),transform 560ms var(--spring-morph)}
#dialsBox{width:84px}#takesBox{width:190px}
.dials{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:20px}
#dialsBox{transition:opacity 260ms var(--spring-soft),transform 380ms var(--spring-pop),left 560ms var(--spring-morph),top 560ms var(--spring-morph)}
#dialsBox.is-hidden{opacity:0;transform:translateX(-10px);pointer-events:none}
#takesBox{opacity:.82;transition:opacity 240ms,left 560ms var(--spring-morph),top 560ms var(--spring-morph)}
#takesBox:hover{opacity:1}
.side.is-hidden{opacity:0!important;pointer-events:none}
#help{position:fixed;left:16px;bottom:16px;z-index:65;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:calc(100vw - 32px)}
.helppill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 8px;border:0;border-radius:999px;font:var(--font-menu);color:var(--ink);cursor:pointer}
.cheat{width:340px;max-width:100%;padding:16px 18px;border-radius:20px;display:flex;flex-direction:column;gap:12px}
.cheat-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font:var(--font-menu);color:var(--ink)}
.cheat-grid .el-kbd{justify-self:start}
.tourbar{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:24px;width:100%;max-width:min(400px,calc(100vw - 32px))}
#help:not(.touring) .tourbar{width:min(400px,calc(100vw - 32px))}
.tour-txt{flex:1}
#underBody{display:flex;flex-direction:column;align-items:center}
#dialsBox .el-dial{width:56px;gap:4px}
.tour-txt{display:flex;flex-direction:column;min-width:0;padding-right:6px}
.tour-txt b{font:var(--font-ui)}
.tour-txt span{font:var(--font-meta);color:var(--ink-secondary)}
.mode-edit #drawer,.mode-edit #sheet{z-index:66}

.layer{position:fixed;z-index:50}
#menuLayer{position:fixed;inset:0;z-index:60;display:none}
#menuLayer.on{display:block}
#popLayer{position:fixed;inset:0;z-index:55;display:none}
#popLayer.on{display:block}
#bubble{position:fixed;z-index:58;display:none;transition:left 300ms var(--spring-soft),top 300ms var(--spring-soft)}
#sheet{position:fixed;left:50%;bottom:16px;z-index:52;width:min(780px,calc(100vw - 32px));transform:translate(-50%,calc(100% + 40px));transition:transform 520ms var(--spring-morph)}
#sheet.on{transform:translate(-50%,0)}
#sheet>.el-sheet{max-height:calc(100vh - 88px);overflow-y:auto;scrollbar-width:thin}
@media (max-height:640px){#sheet .el-stylecard,#sheet .el-stylecard .el-lens{width:92px}#sheet .el-result,#sheet .el-result .el-lens{width:104px!important}}
.pal-list{scrollbar-width:thin}
#panel{position:fixed;inset:0;z-index:57;display:none;place-items:center;padding:24px}
#panel.on{display:grid}
#palette{position:fixed;inset:0;z-index:70;display:none;justify-content:center;align-items:flex-start;padding-top:12vh}
#palette.on{display:flex}
.pal{width:min(560px,calc(100vw - 32px));max-height:min(520px,76vh);display:flex;flex-direction:column;border-radius:20px;overflow:hidden}
.pal input{border:0;outline:0;background:transparent;font:var(--font-body);color:var(--ink);flex:1;min-width:0}
.pal-list{overflow:auto;padding:6px;display:flex;flex-direction:column;gap:1px}
.pal-item{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;font:var(--font-body);cursor:pointer}
.pal-item .el-icon{width:18px;height:18px;color:var(--ink-secondary)}
.pal-item.on{background:color-mix(in oklab,var(--ink) 7%,transparent)}
.pal-item span.h{margin-left:auto;font:var(--font-meta);color:var(--ink-secondary)}
.receded-all>#lens,.receded-all .under,.receded-all .side{filter:blur(var(--recede-blur));opacity:var(--recede-opacity)}
#toast{position:fixed;left:50%;top:72px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity 200ms,transform 400ms var(--spring-pop)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* drawer */
#drawer{position:fixed;left:50%;bottom:0;z-index:45;width:min(1180px,calc(100vw - 24px));transform:translate(-50%,calc(100% - 20px));transition:transform 520ms var(--spring-morph)}
#drawer.on{transform:translate(-50%,0)}
#drawerEdge{position:fixed;left:0;right:0;bottom:0;height:18px;z-index:44}
.mode-theater #drawer,.mode-board #drawer,.mode-idea #drawer{transform:translate(-50%,110%)}
.mode-theater #drawerEdge,.mode-board #drawerEdge,.mode-idea #drawerEdge{display:none}
.stay-zone{position:absolute;top:2px;bottom:2px;border-radius:7px;border:1px dashed color-mix(in oklab,var(--ink) 30%,transparent)}

/* board */
#board{position:fixed;inset:0;z-index:4;display:none;overflow:hidden;cursor:default}
.mode-board #board{display:block}
#boardCanvas{position:absolute;left:0;top:0;width:1400px;height:900px;transform-origin:0 0;transition:transform 300ms var(--spring-soft)}
.bcard{position:absolute;width:92px;aspect-ratio:9/16;--radius-lens:12px;cursor:grab;transition:transform 450ms var(--spring-pop),box-shadow 300ms,filter 300ms,opacity 300ms}
.bcard.dragging{transition:none;cursor:grabbing;z-index:20}
.rowtitle{position:absolute;display:flex;flex-direction:column;gap:8px;width:230px}
#boardCanvas{--zi:1}
.rowtitle .name{font:500 calc(20px * var(--zi))/1.3 var(--font-sans);letter-spacing:-.01em;color:var(--ink)}
.rowtitle .el-status,#boardCanvas .bz,#boardCanvas .el-ghost__label{font-size:calc(12px * var(--zi));line-height:1.3}
.rowtitle .el-pill{font-size:calc(13px * var(--zi));min-height:calc(36px * var(--zi))}
#boardCanvas .el-hand{font-size:calc(22px * var(--zi))}
.rowtitle .play{opacity:0;transition:opacity 200ms}
.rowtitle:hover .play{opacity:1}
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:5px;border-radius:16px}
.dock button{width:40px;height:40px;border-radius:11px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background-color 140ms}
.dock button:hover{background:color-mix(in oklab,var(--ink) 7%,transparent)}
.dock button.on{background:var(--ink);color:var(--text-on-ink)}
.zoom{position:fixed;right:22px;bottom:26px;z-index:30;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px}
.zoom button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--ink-secondary);font:var(--font-ui)}
.zoom button:hover{color:var(--ink);background:color-mix(in oklab,var(--ink) 7%,transparent)}

/* idea */
#idea{position:fixed;inset:64px 0 0 0;z-index:4;display:none;overflow:auto}
.mode-idea #idea{display:block}
.ideaCol{width:min(760px,calc(100vw - 40px));margin:0 auto;padding:7vh 0 80px;display:flex;flex-direction:column;gap:22px}
.ideaPrompt{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 22px;border-radius:999px}
.ideaPrompt input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:var(--font-body);color:var(--ink);height:40px}
.ideaPrompt input::placeholder{color:var(--ink-secondary)}
.stagger>*{animation:el-in 480ms var(--spring-pop) both}

/* set */
.setBar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.timerFx{position:absolute;left:50%;top:10%;z-index:6;width:30%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #111,0 14px 30px rgba(0,0,0,.3);display:grid;place-items:center;font:700 6.4cqmin/1 var(--font-mono);color:#111;transform:translate(-50%,-160%);transition:transform 700ms var(--spring-pop)}
.timerFx.on{transform:translate(-50%,0)}
.timerFx.ring{animation:ring 120ms linear 8}
@keyframes ring{0%,100%{rotate:0deg}25%{rotate:-6deg}75%{rotate:6deg}}
.timerFx::before,.timerFx::after{content:"";position:absolute;top:-12%;width:22%;height:14%;border-radius:50% 50% 20% 20%;background:#111}
.timerFx::before{left:8%;transform:rotate(-30deg)}.timerFx::after{right:8%;transform:rotate(30deg)}

#fxLayer{position:absolute;inset:0;container-type:size;pointer-events:none;z-index:6}
#help.touring{top:72px;bottom:auto}
/* drop */
#analysing{position:fixed;z-index:8}
.beadIn{animation:el-pop 520ms var(--spring-pop) both}
</style></head>
<body class="el-root el-grain mode-edit">

<header class="top">
  <div class="top-l">
    <span class="el-lockup" style="--h:13px"><img id="logo" src="../../assets/logo/eyelore-mark-small.svg" alt=""><span>eyelore</span></span>
    <button class="crumb" id="crumb"><span id="crumbProject">ShopLink</span><span>/</span><b class="ad" id="crumbAd">wear it to bed</b><i data-icon="chevron-right" data-size="14" style="transform:rotate(90deg)"></i></button>
  </div>
  <div class="el-seg" id="modes" style="background:var(--glass-fill);-webkit-backdrop-filter:var(--glass-backdrop);backdrop-filter:var(--glass-backdrop);box-shadow:var(--shadow-glass)">
    <button class="el-seg__opt" data-mode="theater">theater</button>
    <button class="el-seg__opt is-on" data-mode="edit">edit</button>
    <button class="el-seg__opt" data-mode="board">board</button>
  </div>
  <div class="top-r">
    <button class="searchpill" id="openPalette"><i data-icon="search"></i><span class="txt">find a clip, or describe one…</span><span class="el-kbd">⌘K</span></button>
    <button class="el-iconbtn" id="themeBtn" title="theme"><i data-icon="moon" data-size="18"></i></button>
  </div>
</header>

<div id="board"><div id="boardCanvas"></div></div>
<div id="idea"></div>

<svg class="theaterRing" id="theaterRing" style="opacity:0"><circle id="trBase"></circle><circle id="trArc"></circle></svg>

<div id="lens" class="el-lens" data-scene="sofa">
  <div class="el-lens__frame" id="frame">
    <div id="sceneWrap"></div>
    <div id="cutWrap"></div>
    <div id="reveal" class="el-reveal" style="display:none"></div>
    <div id="selection"></div>
    <div id="capLayer"></div>
    <div id="fxLayer"></div>
    <div class="el-lens__meta" id="lensMeta"><span class="el-onvideo el-tc" id="lensTc">0:00</span><span id="lensStatus"></span></div>
    <div id="shim"></div>
    <span class="el-brush" id="brush" style="display:none"></span>
    <div id="compare"></div>
    <div class="el-glass el-export" id="exportPill"></div>
  </div>
  <svg class="el-ring" id="ring" style="display:none"><rect x="1.5" y="1.5" rx="22" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="width:calc(100% - 3px);height:calc(100% - 3px)"></rect></svg>
</div>

<div class="side" id="dialsBox"></div>
<div class="side" id="takesBox"></div>

<div class="under" id="under">
  <div class="explain" id="explain"></div>
  <div id="underBody"></div>
  <div class="hint" id="hint"></div>
</div>

<div id="drawerEdge"></div>
<div id="drawer"></div>

<div id="popLayer"></div>
<div id="bubble"></div>
<div id="sheet"></div>
<div id="panel"></div>
<div id="menuLayer"></div>
<div id="palette"></div>
<div id="toast"></div>
<div id="help"></div>
<div class="el-drop" id="drop"><div class="el-drop__ring">drop to start an edit</div></div>

<script src="editor.js"></script>
</body></html>
