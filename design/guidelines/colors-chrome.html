<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="../assets/eyelore.js"></script>
<style>html,body{margin:0}body{padding:28px;min-height:100vh}.k{font:var(--font-timecode);color:var(--ink-secondary)}.l{font:var(--font-meta);color:var(--ink-secondary)}.row{display:flex;gap:24px;align-items:center}</style></head><body class="el-root"><div style="display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:center"><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:68px;border-radius:12px;background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(17,17,17,.07)"></div><span style="font:var(--font-menu)">hi</span><span class="k">#FFFFFF</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:68px;border-radius:12px;background:#C9CCD1;box-shadow:inset 0 0 0 1px rgba(17,17,17,.07)"></div><span style="font:var(--font-menu)">mid</span><span class="k">#C9CCD1</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:68px;border-radius:12px;background:#9EA3AA;box-shadow:inset 0 0 0 1px rgba(17,17,17,.07)"></div><span style="font:var(--font-menu)">lo</span><span class="k">#9EA3AA</span></div></div>
<div class="row" style="justify-content:center;gap:28px"><div class="el-lens " data-scene="bed" style="width:90px;aspect-ratio:9/16;"><div class="el-lens__frame"><div class="el-scene el-scene--live" data-scene="bed"><b></b><i></i></div></div></div><button class="el-chromebtn"><i data-icon="mic" data-size="16"></i></button><button class="el-chromebtn"><i data-icon="play" data-size="16"></i></button></div></div></body></html>
