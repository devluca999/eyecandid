<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="../assets/eyelore.js"></script>
<style>html,body{margin:0}body{padding:28px;min-height:100vh}.k{font:var(--font-timecode);color:var(--ink-secondary)}.l{font:var(--font-meta);color:var(--ink-secondary)}.row{display:flex;gap:24px;align-items:center}.m{display:flex;flex-direction:column;gap:6px}.m b{font:var(--font-menu);margin-top:12px}.m:hover .morph{width:60px!important;aspect-ratio:9/16!important;border-radius:14px!important}</style></head><body class="el-root"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-top:8px">

<div class="m"><div class="el-lens is-receded" data-scene="gym" style="width:px;aspect-ratio:16/10;width:100%"><div class="el-lens__frame"><div class="el-scene el-scene--live" data-scene="gym"><b></b><i></i></div></div></div><b>recede</b><span class="k">blur 12 · opacity .4</span></div>
<div class="m"><div class="el-lens " data-scene="case" style="width:px;aspect-ratio:16/10;width:100%"><div class="el-lens__frame"><div class="el-scene el-scene--live" data-scene="case"><b></b><i></i></div><div class="el-shimmer"></div></div></div><b>generating</b><span class="k">shimmer · 2.8s</span></div></div></body></html>
