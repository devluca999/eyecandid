<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:190px}.m{display:flex;flex-direction:column;gap:10px;font:var(--type-meta);color:var(--ink-secondary)}.b{width:180px;height:100px;border-radius:20px;background:linear-gradient(140deg,#d8b393,#7d6252);box-shadow:var(--shadow-lens-rest);transition:transform var(--dur-lift) var(--spring),box-shadow var(--dur-lift) var(--spring),border-radius var(--dur-morph) var(--spring),width var(--dur-morph) var(--spring)}.lift:hover{transform:translateY(-4px);box-shadow:var(--shadow-lens-lift)}.morph:hover{border-radius:50%;width:100px}.shim{background:linear-gradient(100deg,#e8e4db 30%,#f7f5f0 50%,#e8e4db 70%);background-size:200% 100%;animation:el-shimmer 2.8s linear infinite}</style></head><body class="el-paper"><div style="display:flex;gap:24px">
<div class="m"><div class="b lift"></div><span>hover lift · 4px · 260ms</span></div>
<div class="m"><div class="b morph"></div><span>Lens morph · 450ms spring</span></div>
<div class="m"><div class="b shim"></div><span>generating · slow shimmer</span></div></div></body></html>
