<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:120px}</style></head><body class="el-paper"><div style="display:flex;gap:40px;align-items:center;font:var(--type-ui)"><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:#2F9E5F"></span>ready<span style="font:var(--type-meta);color:var(--ink-secondary);margin-left:6px">#2F9E5F</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:#5B7CFA;animation:el-pulse 1.4s infinite"></span>working<span style="font:var(--type-meta);color:var(--ink-secondary);margin-left:6px">#5B7CFA</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:#D9822B"></span>attention<span style="font:var(--type-meta);color:var(--ink-secondary);margin-left:6px">#D9822B</span></div></div><div style="margin-top:20px;font:var(--type-meta);color:var(--ink-secondary)">--status-ready · --status-working (= accent) · --status-attention</div></body></html>
