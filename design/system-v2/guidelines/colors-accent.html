<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:170px}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}.c{height:56px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(17,17,17,.08)}.n{font:var(--type-ui);margin-top:8px}.t{font:var(--type-meta);color:var(--ink-secondary)}</style></head><body class="el-paper"><div style="display:flex;gap:24px;align-items:center"><div class="row" style="flex:0 0 320px;grid-template-columns:repeat(3,1fr)"><div class="s"><div class="c" style="background:#5B7CFA"></div><div class="n">accent</div><div class="t">--accent</div><div class="t">#5B7CFA</div></div><div class="s"><div class="c" style="background:#3D5BD9"></div><div class="n">text · paper</div><div class="t">--accent-text</div><div class="t">#3D5BD9</div></div><div class="s"><div class="c" style="background:#8EA4FF"></div><div class="n">text · night</div><div class="t">--accent-text</div><div class="t">#8EA4FF</div></div></div><div style="flex:1;display:flex;flex-direction:column;gap:10px"><div style="position:relative;height:72px;border-radius:20px;background:linear-gradient(160deg,#c9a58a,#6d4f3d);box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--accent)"></div><div style="font:var(--type-meta);color:var(--ink-secondary)">One accent. It marks what’s selected, and nothing else — never decoration, never a CTA fill.</div></div></div></body></html>
