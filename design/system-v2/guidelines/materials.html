<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:230px}.l{font:var(--type-meta);color:var(--ink-secondary);margin-top:10px}</style></head><body class="el-paper"><div style="display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:16px">
<div><div class="el-paper" style="height:140px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--hairline)"></div><div class="l">paper · canvas + faint grain</div></div>
<div><div style="height:140px;border-radius:20px;background:radial-gradient(50% 70% at 30% 40%,#f2c79d,transparent),radial-gradient(50% 60% at 80% 60%,#5f7ab0,transparent),#a37e66;position:relative;overflow:hidden;box-shadow:0 18px 40px -12px rgba(184,130,90,.55)"><div class="el-glass" style="position:absolute;left:16px;right:16px;bottom:16px;height:52px;display:flex;align-items:center;padding:0 14px;font:var(--type-ui)">keep this take</div></div><div class="l">glass · only over footage</div></div>
<div><div class="el-chrome" style="height:140px;border-radius:20px;background:var(--surface-raised);box-shadow:var(--shadow-lens-rest)"></div><div class="l">chrome · 1px hairline on every Lens</div></div></div></body></html>
