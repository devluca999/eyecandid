<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:24px}.lbl{font:var(--type-meta);color:var(--ink-secondary)}</style></head><body class="el-paper"><div id="root"></div>
<script type="text/babel">
const DS = window.EyeloreDesignSystem_65a209;

const { Lens } = DS;
function App(){
  const shapes=['edit','circle','card'];
  const [i,setI]=React.useState(0);
  return <div style={{display:'flex',gap:32,alignItems:'flex-start'}}>
    <div style={{width:300,height:330,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12}}>
      <Lens shape={shapes[i]} aspect="4:5" width={shapes[i]==='card'?170:shapes[i]==='circle'?260:240} scene="walnut-lamp" playing timecode="00:14.32" label="take 2" onClick={()=>setI((i+1)%3)} caption={shapes[i]==='circle'?null:'the only ring I wear'} />
      <span className="lbl">{shapes[i]} · click to morph</span>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'28px 24px',paddingTop:8}}>
      {[['rest','morning-sheets'],['hover','gym-dumbbell'],['selected','rose-case'],['generating','creator-portrait']].map(([s,sc])=>
        <div key={s} style={{display:'flex',flexDirection:'column',gap:10}}><Lens width={150} aspect="16:9" state={s} scene={sc} timecode="0:08" label="ready" /><span className="lbl">{s}</span></div>)}
      <div style={{display:'flex',flexDirection:'column',gap:10}}><Lens width={150} aspect="16:9" scene="walnut-lamp" progress={62}/><span className="lbl">export ring · 62%</span></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
