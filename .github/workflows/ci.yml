name: ci
# Required on every PR (ADR 0008). Jobs that need secrets report "skipped · needs keys" instead of passing silently.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

env:
  NODE_VERSION: 22
  PNPM_VERSION: 12.14.0

jobs:
  checks:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: generated files are up to date (contract schema, tokens)
        run: |
          pnpm --filter @eyelore/core schema:emit
          pnpm --filter @eyelore/ui tokens
          git diff --exit-code -- packages/core/schema packages/ui/src
      - name: convex codegen
        run: npx convex codegen --typecheck disable 2>/dev/null || true
      - run: pnpm turbo run lint typecheck test

  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  convex:
    name: convex function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p convex --noEmit
      - run: pnpm convex:test

  engine:
    name: engine pytest + contract
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      # the runner's Ubuntu ffmpeg (libass, libx264): the fast render's real-render test runs instead of skipping
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: .venv/bin/pytest -q
      - name: fast render benchmark (temporary, for the PR's numbers)
        run: |
          .venv/bin/python scripts/bench_fast_render.py /tmp/bench-src.mp4
          .venv/bin/python scripts/bench_fast_render.py /tmp/bench-src.mp4
          EYELORE_FAST_PRESET=superfast .venv/bin/python scripts/bench_fast_render.py /tmp/bench-src.mp4
      - name: fast render on ffmpeg 6.1 (Ubuntu 24.04, the engine image's base; temporary)
        working-directory: .
        run: |
          cp /tmp/bench-src.mp4 bench-src.mp4
          docker run --rm -v "$PWD":/repo -w /repo/services/engine ubuntu:24.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg python3 python3-venv > /dev/null
            ffmpeg -version | head -1
            python3 -m venv /venv && /venv/bin/pip install -q -e ".[dev]"
            /venv/bin/pytest -q tests/test_fast_render.py tests/test_sound.py tests/test_qc_measure.py
            /venv/bin/python scripts/bench_fast_render.py /repo/bench-src.mp4'

  e2e:
    name: web e2e + visual (local convex + real cpu worker)
    runs-on: ubuntu-latest
    needs: [checks]
    env:
      CONVEX_AGENT_MODE: anonymous
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      EYELORE_CONVEX_SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: start a local convex backend
        run: |
          (npx convex dev > convex.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf $EYELORE_CONVEX_SITE_URL/worker/hello && break; sleep 2; done
          curl -sf $EYELORE_CONVEX_SITE_URL/worker/hello || (cat convex.log; exit 1)
      - name: admin token for /funnel and /admin/access (a throwaway value for this local backend only)
        run: npx convex env set EYELORE_ADMIN_TOKEN "$E2E_ADMIN_TOKEN"
        env: { E2E_ADMIN_TOKEN: ci-local-admin }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: start a real cpu worker (transcribe, autocut, reframe, render)
        run: |
          TOKEN=$(npx convex run workers:register '{"name":"ci","provider":"cpu"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          cd services/engine && uv venv --python 3.12 && uv pip install -e '.[cpu]'
          (EYELORE_WORKER_TOKEN=$TOKEN EYELORE_PROVIDER=cpu EYELORE_WORKER_NAME=ci EYELORE_HELLO_STEP_S=0.4 EYELORE_TRANSCRIBE_MODEL=base .venv/bin/eyelore-worker > ../../worker.log 2>&1 &)
      - run: pnpm --filter @eyelore/web build
      - run: pnpm --filter @eyelore/web exec playwright install --with-deps chromium
      - name: playwright (functional + visual regression)
        run: pnpm --filter @eyelore/web exec playwright test --update-snapshots=missing --grep-invert @paused
        env: { E2E_WORKER: "1", E2E_REAL_WORKER: "1", CI: "1", E2E_ADMIN_TOKEN: ci-local-admin }
      # free_paused is global, so the paused-day refusal runs alone, after everything else, and the flag goes back off
      - name: playwright · a paused free day (flag on, one test, flag off)
        run: |
          npx convex run flags:set '{"key":"free_paused","enabled":true}'
          status=0
          pnpm --filter @eyelore/web exec playwright test e2e/ux-crawl.spec.ts e2e/landing.spec.ts --grep @paused --project=desktop --reporter=line || status=$?
          npx convex run flags:set '{"key":"free_paused","enabled":false}'
          exit $status
        env: { CI: "1", E2E_PAUSED: "1" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/e2e/**/*-linux.png
            convex.log
            worker.log

  keys:
    name: which deploy keys exist
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.k.outputs.vercel }}
      convex: ${{ steps.k.outputs.convex }}
      expo: ${{ steps.k.outputs.expo }}
    steps:
      - id: k
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "vercel=${VERCEL_TOKEN:+yes}" >> $GITHUB_OUTPUT
          echo "convex=${CONVEX_PREVIEW_DEPLOY_KEY:+yes}" >> $GITHUB_OUTPUT
          echo "expo=${EXPO_TOKEN:+yes}" >> $GITHUB_OUTPUT
          [ -n "$VERCEL_TOKEN" ] || echo "::notice::web preview skipped · needs VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
          [ -n "$CONVEX_PREVIEW_DEPLOY_KEY" ] || echo "::notice::convex preview skipped · needs CONVEX_PREVIEW_DEPLOY_KEY"
          [ -n "$EXPO_TOKEN" ] || echo "::notice::eas update on main skipped · needs EXPO_TOKEN"

  # A preview costs one Convex deployment, and the team has 40. A PR that cannot change the web app or the backend
  # (docs, scripts, the engine) gets none; the rest are deleted when the PR closes (preview-cleanup.yml).
  preview-changes:
    name: preview paths changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'convex/**'
              - 'packages/**'
              - 'brand/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'convex.json'
              - '.github/workflows/ci.yml'

  preview-web:
    name: preview · convex + vercel
    if: github.event_name == 'pull_request' && needs.keys.outputs.vercel == 'yes' && needs.keys.outputs.convex == 'yes' && needs.preview-changes.outputs.web == 'true'
    needs: [keys, checks, preview-changes]
    runs-on: ubuntu-latest
    permissions: { contents: read, statuses: write }
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: convex preview deployment, then build web against it
        env: { CONVEX_DEPLOY_KEY: "${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}" }
        run: |
          npx convex deploy --preview-create "pr-${{ github.event.number }}" \
            --cmd 'echo "$NEXT_PUBLIC_CONVEX_URL" > "$RUNNER_TEMP/convex-url" && npx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
      # preview-cleanup.yml reads this status when the PR closes, to delete the deployment it names
      - name: note which convex deployment this PR's preview is
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          name=$(sed -E 's#^https://([a-z0-9-]+)\.convex\.cloud/?$#\1#' "$RUNNER_TEMP/convex-url")
          [[ "$name" =~ ^[a-z]+-[a-z]+-[0-9]+$ ]] || { echo "::warning::could not read the preview deployment's name"; exit 0; }
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success -f context="convex preview" -f description="$name" > /dev/null
      - id: deploy
        run: echo "url=$(npx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
      - run: echo "::notice::web preview · ${{ steps.deploy.outputs.url }}"

  mobile-changes:
    name: mobile paths changed?
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/core/src/**'
              - 'packages/ui/src/**'
              - 'convex/_generated/**'
              - 'pnpm-lock.yaml'

  # The APK is built on this runner, not in the EAS cloud: a free-tier cloud build waits ~17 min in the queue and then
  # builds for 14-26 min, so `eas build --wait` outlived every push (and each cancelled run left its build queued).
  # Hermetic like the web e2e: a local Convex backend and a real CPU worker; the emulator reaches them over
  # `adb reverse`. Needs no secrets. Installable builds for real devices: `eas build --profile preview`.
  mobile-e2e:
    name: mobile e2e · android build + maestro (local convex + real cpu worker)
    needs: [checks, mobile-changes]
    if: needs.mobile-changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONVEX_AGENT_MODE: anonymous
      EXPO_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      EYELORE_CONVEX_SITE_URL: http://127.0.0.1:3211
      EYELORE_E2E: "1"
    steps:
      - name: free disk space (the native build, the worker and the emulator image do not fit otherwise)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: false } # PR branches save the Gradle cache too: a cold native build is ~29 min
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      # the APK only changes with the app's inputs: flow and CI edits reuse it instead of a ~29 min native build
      - uses: actions/cache/restore@v4
        id: apk
        with:
          path: app.apk
          key: apk-x86_64-${{ hashFiles('apps/mobile/**', '!apps/mobile/.maestro/**', 'packages/core/src/**', 'packages/ui/src/**', 'convex/_generated/*.js', 'pnpm-lock.yaml') }}
      - name: release apk for the emulator (x86_64 only, signed with the debug key)
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app.apk"
          # build intermediates are several GB: drop them before the emulator image is installed
          ./gradlew --stop || true
          rm -rf app/build app/.cxx build
          find "$GITHUB_WORKSPACE/node_modules" -type d \( -name .cxx -o -path '*/android/build' \) -prune -exec rm -rf {} + || true
          df -h /
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app.apk
          key: ${{ steps.apk.outputs.cache-primary-key }}
      - name: what this runner has; warm the renderer's headless browser before the emulator takes the cores
        run: |
          nproc; free -g; df -h /
          cd services/render && npx remotion browser ensure
      - name: start a local convex backend
        run: |
          (npx convex dev > convex.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf $EYELORE_CONVEX_SITE_URL/worker/hello && break; sleep 2; done
          curl -sf $EYELORE_CONVEX_SITE_URL/worker/hello || (cat convex.log; exit 1)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: start a real cpu worker (transcribe, autocut, reframe, render)
        run: |
          TOKEN=$(npx convex run workers:register '{"name":"ci","provider":"cpu"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          cd services/engine && uv venv --python 3.12 && uv pip install -e '.[cpu]'
          (EYELORE_WORKER_TOKEN=$TOKEN EYELORE_PROVIDER=cpu EYELORE_WORKER_NAME=ci EYELORE_HELLO_STEP_S=0.4 EYELORE_TRANSCRIBE_MODEL=base .venv/bin/eyelore-worker > ../../worker.log 2>&1 &)
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash && echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: maestro on an android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash apps/mobile/.maestro/run-ci.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro
          path: |
            maestro-report.xml
            maestro-debug
            worker.log
            convex.log

  engine-image:
    name: engine image builds (no push)
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            engine:
              - 'services/engine/**'
              - 'services/render/**'
              - 'packages/core/**'
              - 'pnpm-lock.yaml'
      - if: steps.changes.outputs.engine == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.changes.outputs.engine == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/engine/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
