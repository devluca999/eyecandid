name: ci
# Required on every PR (ADR 0008). Jobs that need secrets report "skipped · needs keys" instead of passing silently.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

env:
  NODE_VERSION: 22
  PNPM_VERSION: 12.14.0

jobs:
  checks:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: generated files are up to date (contract schema, tokens)
        run: |
          pnpm --filter @eyelore/core schema:emit
          pnpm --filter @eyelore/ui tokens
          git diff --exit-code -- packages/core/schema packages/ui/src
      - name: convex codegen
        run: npx convex codegen --typecheck disable 2>/dev/null || true
      - run: pnpm turbo run lint typecheck test

  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  convex:
    name: convex function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p convex --noEmit
      - run: pnpm convex:test

  engine:
    name: engine pytest + contract
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: .venv/bin/pytest -q

  e2e:
    name: web e2e + visual (local convex + cpu-stub worker)
    runs-on: ubuntu-latest
    needs: [checks]
    env:
      CONVEX_AGENT_MODE: anonymous
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      EYELORE_CONVEX_SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: start a local convex backend
        run: |
          (npx convex dev > convex.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf $EYELORE_CONVEX_SITE_URL/worker/hello && break; sleep 2; done
          curl -sf $EYELORE_CONVEX_SITE_URL/worker/hello || (cat convex.log; exit 1)
      - name: start a cpu-stub worker
        run: |
          TOKEN=$(npx convex run workers:register '{"name":"ci","provider":"cpu-stub"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          cd services/engine && uv venv --python 3.12 && uv pip install -e .
          (EYELORE_WORKER_TOKEN=$TOKEN EYELORE_PROVIDER=cpu-stub EYELORE_WORKER_NAME=ci EYELORE_HELLO_STEP_S=0.4 .venv/bin/eyelore-worker > ../../worker.log 2>&1 &)
      - run: pnpm --filter @eyelore/web build
      - run: pnpm --filter @eyelore/web exec playwright install --with-deps chromium
      - name: playwright (functional + visual regression)
        run: pnpm --filter @eyelore/web exec playwright test --update-snapshots=missing
        env: { E2E_WORKER: "1", CI: "1" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/e2e/**/*-linux.png
            convex.log
            worker.log

  keys:
    name: which deploy keys exist
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.k.outputs.vercel }}
      convex: ${{ steps.k.outputs.convex }}
      expo: ${{ steps.k.outputs.expo }}
    steps:
      - id: k
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "vercel=${VERCEL_TOKEN:+yes}" >> $GITHUB_OUTPUT
          echo "convex=${CONVEX_PREVIEW_DEPLOY_KEY:+yes}" >> $GITHUB_OUTPUT
          echo "expo=${EXPO_TOKEN:+yes}" >> $GITHUB_OUTPUT
          [ -n "$VERCEL_TOKEN" ] || echo "::notice::web preview skipped · needs VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
          [ -n "$CONVEX_PREVIEW_DEPLOY_KEY" ] || echo "::notice::convex preview skipped · needs CONVEX_PREVIEW_DEPLOY_KEY"
          [ -n "$EXPO_TOKEN" ] || echo "::notice::mobile preview + maestro skipped · needs EXPO_TOKEN"

  preview-web:
    name: preview · convex + vercel
    if: github.event_name == 'pull_request' && needs.keys.outputs.vercel == 'yes' && needs.keys.outputs.convex == 'yes'
    needs: [keys, checks]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: convex preview deployment, then build web against it
        env: { CONVEX_DEPLOY_KEY: "${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}" }
        run: |
          npx convex deploy --preview-create "pr-${{ github.event.number }}" \
            --cmd 'npx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
      - id: deploy
        run: echo "url=$(npx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
      - run: echo "::notice::web preview · ${{ steps.deploy.outputs.url }}"

  preview-mobile:
    name: preview · eas build + maestro
    if: github.event_name == 'pull_request' && needs.keys.outputs.expo == 'yes'
    needs: [keys, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - name: eas preview build (android apk, points at the dev deployment via eas.json)
        id: build
        working-directory: apps/mobile
        run: |
          eas build --profile preview --platform android --non-interactive --wait --json > build.json
          echo "apk=$(python3 -c 'import json;print(json.load(open("build.json"))[0]["artifacts"]["buildUrl"])')" >> $GITHUB_OUTPUT
      - name: a worker answering on the dev deployment
        env:
          EYELORE_CONVEX_SITE_URL: https://deafening-hedgehog-824.convex.site
          EYELORE_WORKER_TOKEN: ${{ secrets.EYELORE_DEV_WORKER_TOKEN }}
        run: |
          cd services/engine && uv venv --python 3.12 && uv pip install -e .
          (EYELORE_PROVIDER=cpu EYELORE_WORKER_NAME=ci-preview-${{ github.run_id }} .venv/bin/eyelore-worker > ../../worker.log 2>&1 &)
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash && echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - run: curl -L -o app.apk "${{ steps.build.outputs.apk }}"
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: maestro on an android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: adb install app.apk && maestro test apps/mobile/.maestro --format junit --output maestro-report.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: maestro, path: "maestro-report.xml\nworker.log" }
