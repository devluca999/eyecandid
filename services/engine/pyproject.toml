[project]
name = "eyelore-engine"
version = "0.1.0"
description = "Eyelore GPU worker: pulls jobs from Convex over HTTPS (outbound only)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.28", "jsonschema>=4.23"]

[project.optional-dependencies]
# real CPU work: transcription, face tracking (render additionally needs Node + services/render, and ffmpeg)
cpu = ["faster-whisper>=1.1", "av>=14,<17", "opencv-python-headless>=4.10,<5", "numpy>=1.26"]
gpu = ["faster-whisper>=1.1", "av>=14,<17", "opencv-python-headless>=4.10,<5", "numpy>=1.26", "huggingface_hub>=0.30"]
sentry = ["sentry-sdk>=2.0"]
dev = ["pytest>=8.3", "respx>=0.22"]

[project.scripts]
eyelore-worker = "eyelore_engine.worker:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyelore_engine"]
artifacts = ["eyelore_engine/jobs.schema.json"]

[tool.hatch.build.targets.sdist]
artifacts = ["eyelore_engine/jobs.schema.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
